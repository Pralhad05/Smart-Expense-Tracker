<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - Smart Expense Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F8F9FA] text-slate-900">
	<div class="min-h-screen flex items-center justify-center px-4">
		<main
			class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl auth-card">

			<div class="text-center mb-8">
				<div
					class="mx-auto h-14 w-14 rounded-2xl bg-[#844FC1] flex items-center justify-center text-white text-3xl shadow-lg">
					₹</div>

				<h1 class="text-2xl font-bold mt-4">Reset Password</h1>
				<p class="text-[#6C7293] mt-1">Enter your username and new
					password.</p>
			</div>

			<form onsubmit="event.preventDefault(); resetPassword();"
				class="space-y-4">
				<input id="fpUsername" type="text" placeholder="Username"
					class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-[#844FC1] focus:ring-4 focus:ring-[#844FC1]/20"
					required> <input id="newPassword" type="password"
					placeholder="New Password"
					class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-[#844FC1] focus:ring-4 focus:ring-[#844FC1]/20"
					required>

				<button
					class="w-full bg-[#844FC1] hover:bg-[#7442ad] text-white rounded-xl py-3 font-semibold transition">
					Reset Password</button>
			</form>

			<p id="message" class="text-center text-sm text-rose-600 mt-4"></p>

			<p class="text-center text-[#6C7293] mt-6">
				Back to <a href="/login"
					class="text-[#844FC1] font-semibold hover:underline"> Login </a>
			</p>

			<p class="text-center mt-3">
				<a href="/" class="text-sm text-[#6C7293] hover:text-[#844FC1]">
					Back to home </a>
			</p>
		</main>
	</div>

	<style>
.auth-card {
	animation: authIn 0.55s ease both;
}

@
keyframes authIn {from { opacity:0;
	transform: translateY(24px) scale(0.98);
}

to {
	opacity: 1;
	transform: translateY(0) scale(1);
}
}
</style>

	<script src="/app.js"></script>
</body>
</html>
