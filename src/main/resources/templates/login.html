<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100 text-slate-900">
<div class="min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-md bg-white/95 border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl auth-card">

        <div class="text-center mb-8">
            <div class="mx-auto h-14 w-14 rounded-2xl bg-blue-600 flex items-center justify-center text-white text-3xl shadow-lg">
                ₹
            </div>
            <h1 class="text-2xl font-bold mt-4">Welcome Back</h1>
            <p class="text-slate-500 mt-1">Login to continue your dashboard</p>
        </div>

        <form onsubmit="event.preventDefault(); login();" class="space-y-4">
            <input id="username"
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-100"
                   placeholder="Username"
                   required>

            <input id="password"
                   type="password"
                   class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-100"
                   placeholder="Password"
                   required>

            <div class="flex justify-end">
                <a href="/forgot" class="text-sm font-medium text-blue-600 hover:underline">
                    Forgot password?
                </a>
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-semibold transition">
                Login
            </button>
        </form>

        <p class="text-center text-slate-600 mt-6">
            New user?
            <a href="/register" class="text-blue-600 font-semibold hover:underline page-link">
                Create account
            </a>
        </p>

        <p class="text-center mt-3">
            <a href="/" class="text-sm text-slate-500 hover:text-blue-600">Back to home</a>
        </p>
    </main>
</div>

<style>
    .auth-card {
        animation: authIn 0.55s ease both;
    }

    @keyframes authIn {
        from { opacity: 0; transform: translateY(24px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
</style>

<script src="/app.js"></script>
</body>
</html>
